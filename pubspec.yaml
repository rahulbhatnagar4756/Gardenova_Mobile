name: kasagardem
description: "A plant and garden management app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev Gardenova
version: 1.0.1+3
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_skill: ^0.2.6
  get: ^4.7.2
  http: ^1.5.0
  intl: ^0.20.2
  crypto: ^3.0.7
  lottie: ^3.3.2
  pinput: ^6.0.2
  share_plus: ^13.1.0
  geolocator: ^14.0.2
  path_provider: ^2.1.3
  gal: ^2.3.2
  package_info_plus: ^10.1.0

  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  dotted_border: ^3.1.0

  flutter_dotenv: ^6.0.0
  google_sign_in: ^7.1.1
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.0
  flutter_spinkit: ^5.2.2
  webview_flutter: ^4.13.0
  connectivity_plus: ^7.0.0
  shimmer_animation: ^2.2.2
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  linear_progress_bar: ^3.0.0
  staggered_grid_view: ^0.0.1
  cached_network_image: ^3.4.1
  flutter_facebook_auth: ^7.1.2
  flutter_native_splash: ^2.4.6
  syncfusion_flutter_charts: ^33.1.47
  flutter_screenutil: ^5.9.3
  photo_view: ^0.15.0
  permission_handler: ^12.0.1
  internet_connection_checker_plus: ^2.8.0
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_storage: ^13.4.1
  firebase_crashlytics: ^5.2.2
  firebase_analytics: ^12.4.1
  geocoding: ^4.0.0
  in_app_purchase: ^3.3.0
#  google_mobile_ads: ^8.0.0
  flutter_local_notifications: ^22.0.0
  firebase_messaging: ^16.3.0
  

  flutter_localizations:
    sdk: flutter
  camera: ^0.12.0+1
  path: ^1.9.1
  in_app_purchase_android: ^0.5.0
  razorpay_flutter: ^1.4.5
dependency_overrides:
  shared_preferences_foundation: 2.1.4
  geolocator: ^14.0.2
  
  package_info_plus: ^10.1.0
  win32: ^6.2.0
  flutter_secure_storage_windows: ^4.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name:


flutter:
  uses-material-design: true
  generate: true


  assets:
    - assets/images/
    - assets/fonts/
    - assets/json/
    - assets/html/
    - secret.env


  fonts:
    - family: poppins
      fonts:
        - asset: assets/fonts/poppins_light_300.ttf
          weight: 300
        - asset: assets/fonts/poppins_regular_400.ttf
          weight: 400
        - asset: assets/fonts/poppins_medium_500.ttf
          weight: 500
        - asset: assets/fonts/poppins_semi_bold_600.ttf
          weight: 600
        - asset: assets/fonts/poppins_bold_700.ttf
          weight: 700
        - asset: assets/fonts/poppins_extraBold_800.ttf
          weight: 800
        - asset: assets/fonts/poppins_black_900.ttf
          weight: 900
flutter_native_splash:
  icon_background_color: "#2E3A30"
  android_12:
    icon_background_color: "#2E3A30"
  android: true
  ios: true
  color: "#2E3A30"
